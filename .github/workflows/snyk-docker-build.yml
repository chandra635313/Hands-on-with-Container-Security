name: Build Docker and Scan with Snyk

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  docker-build-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build JAR
        run: mvn clean package -DskipTests

      - name: Build Docker image
        run: docker build -t my-java-app:latest .

      - name: Install Snyk
        run: npm install -g snyk

      - name: Authenticate Snyk
        run: snyk auth ${{ secrets.SNYK_TOKEN }}

      - name: Scan Docker image
        continue-on-error: true
        run: snyk container test my-java-app:latest --file=Dockerfile

      - name: Generate report
        continue-on-error: true
        run: snyk container test my-java-app:latest --file=Dockerfile --json > snyk-report.json

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: snyk-report
          path: snyk-report.json

      - name: Monitor in Snyk dashboard
        run: snyk container monitor my-java-app:latest --file=Dockerfile
